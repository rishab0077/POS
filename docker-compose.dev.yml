services:
  app:
    build:
      target: test
    image: restaurant-pos-dev:latest
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage

  nginx:
    volumes:
      - ./:/var/www/html:ro
      - ./storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  queue:
    image: restaurant-pos-dev:latest
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage

  scheduler:
    image: restaurant-pos-dev:latest
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage

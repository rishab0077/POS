name: Restaurant POS CI/CD

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY_HOST: git.aayutech.dev
  APP_IMAGE_REPOSITORY: git.aayutech.dev/rishab/restaurant-pos-app
  WEB_IMAGE_REPOSITORY: git.aayutech.dev/rishab/restaurant-pos-web

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare Docker tooling
        run: bash scripts/ci/prepare-docker.sh

      - name: Resolve immutable image tag
        run: |
          set -euo pipefail
          test -n "${GITHUB_SHA:-}"
          RUN_SUFFIX="${GITHUB_RUN_ID:-${GITHUB_SHA:0:12}}"
          RUN_SUFFIX="$(printf '%s' "$RUN_SUFFIX" | tr -cd 'A-Za-z0-9_.-')"
          echo "APP_IMAGE_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=restaurant-pos-ci-${RUN_SUFFIX}" >> "$GITHUB_ENV"

      - name: Prepare CI environment
        run: |
          set -euo pipefail
          cp .env.production.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's|^APP_URL=.*|APP_URL=http://localhost|' .env
          sed -i 's/^APP_HEALTH_HOST=.*/APP_HEALTH_HOST=127.0.0.1/' .env
          sed -i 's|^APP_KEY=.*|APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=|' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci_database_password/' .env
          sed -i 's/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=ci_root_password/' .env
          sed -i 's/^PUSHER_APP_SECRET=.*/PUSHER_APP_SECRET=ci_soketi_secret/' .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=CiAdminPassword123!/' .env

      - name: Build immutable production images
        run: docker compose build app nginx

      - name: Verify runtime image contents
        run: |
          docker compose run --rm --no-deps app sh -lc '
            test -f vendor/autoload.php
            test -f public/build/manifest.json
            ! command -v composer
            ! command -v node
            ! command -v npm
          '

      - name: Build isolated test image
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml build app

      - name: Start isolated test database
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d mysql

      - name: Validate PHP dependencies
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm --no-deps app composer validate --strict
          docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm --no-deps app composer audit --no-interaction

      - name: Validate frontend runtime dependencies
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm --no-deps app npm audit --omit=dev --audit-level=high

      - name: Scan repository for committed secrets
        run: |
          set -euo pipefail
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --source . --no-git --redact --verbose --config .gitleaks.toml
          else
            echo "::warning::gitleaks is not installed on this runner; install a trusted gitleaks binary to make secret scanning blocking."
          fi

      - name: Run tests
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm app php artisan test

      - name: Verify optimized caches
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm app php artisan config:cache
          docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm app php artisan route:cache
          docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm app php artisan view:cache

      - name: Scan production images for high/critical vulnerabilities
        if: vars.ENABLE_TRIVY_IMAGE_SCAN == 'true'
        run: |
          set -euo pipefail
          if command -v trivy >/dev/null 2>&1; then
            trivy image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$APP_IMAGE_REPOSITORY:$APP_IMAGE_TAG"
            trivy image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$WEB_IMAGE_REPOSITORY:$APP_IMAGE_TAG"
          else
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.50.1 image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$APP_IMAGE_REPOSITORY:$APP_IMAGE_TAG"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.50.1 image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$WEB_IMAGE_REPOSITORY:$APP_IMAGE_TAG"
          fi

      - name: Login to Gitea container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          test -n "${REGISTRY_TOKEN:-}" || { echo "Missing Actions secret: REGISTRY_TOKEN"; exit 1; }
          REGISTRY_USERNAME="${REGISTRY_USERNAME:-${GITHUB_ACTOR:-}}"
          test -n "$REGISTRY_USERNAME" || { echo "Missing Actions variable: REGISTRY_USERNAME"; exit 1; }
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Publish tested production images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker push "$APP_IMAGE_REPOSITORY:$APP_IMAGE_TAG"
          docker push "$WEB_IMAGE_REPOSITORY:$APP_IMAGE_TAG"

      - name: Show service logs on failure
        if: failure()
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            docker compose -f docker-compose.yml -f docker-compose.test.yml logs --tail=200
          fi

      - name: Stop CI services
        if: always()
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 25
    env:
      REGISTRY_HOST: git.aayutech.dev
      APP_IMAGE_REPOSITORY: git.aayutech.dev/rishab/restaurant-pos-app
      WEB_IMAGE_REPOSITORY: git.aayutech.dev/rishab/restaurant-pos-web
      APP_IMAGE_TAG: sha-${{ github.sha }}
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_PATH: /opt/restaurant-pos
      VM_HOST: ${{ vars.VM_HOST }}
      VM_PORT: ${{ vars.VM_PORT }}
      VM_USERNAME: ${{ vars.VM_USERNAME }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Deploy tested images to production
        run: bash scripts/ci/deploy-over-ssh.sh

map $http_x_forwarded_host $laravel_forwarded_host {
    default $http_x_forwarded_host;
    "" $http_host;
}

map $http_x_forwarded_proto $laravel_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_host $laravel_host_port {
    default $server_port;
    "~:(?<port>\d+)$" $port;
}

map "$http_x_forwarded_proto:$http_x_forwarded_port" $laravel_forwarded_port {
    "~^https:$" 443;
    "~^http:$" 80;
    "~^.+:(.+)$" $1;
    default $laravel_host_port;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $laravel_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $laravel_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $laravel_forwarded_proto;
        include fastcgi_params;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~* ^/storage/.*\.php$ {
        deny all;
    }

    location /app/ {
        proxy_pass http://soketi:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /apps/ {
        proxy_pass http://soketi:6001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
